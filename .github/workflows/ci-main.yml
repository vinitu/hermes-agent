name: CI · Main Push · Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-main-hermes
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install hadolint
        run: |
          curl -sL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          chmod +x /usr/local/bin/hadolint

      - name: Lint
        run: hadolint Dockerfile

  calculate_tag:
    name: Compute image tag
    needs:
      - lint
    if: |
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.actor != 'github-actions[bot]'
      ) || (
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    outputs:
      new-tag: ${{ steps.tag.outputs.new-tag }}
      previous-tag: ${{ steps.tag.outputs.previous-tag }}
      base-tag: ${{ steps.tag.outputs.base-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute tag from base Hermes image
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          base_tag="$(sed -n 's/^FROM nousresearch\/hermes-agent:\([^[:space:]]*\).*/\1/p' Dockerfile)"
          if [[ -z "$base_tag" ]]; then
            echo "Could not find base Hermes image tag in Dockerfile" >&2
            exit 1
          fi

          git fetch --tags --force

          previous_tag="$(git tag --sort=-creatordate | head -n 1 || true)"

          if ! git rev-parse -q --verify "refs/tags/${base_tag}" >/dev/null; then
            new_tag="$base_tag"
          else
            latest_build="$(
              git tag --list "${base_tag}-build.*" \
                | sed -n "s/^${base_tag}-build\\.\\([0-9][0-9]*\\)$/\\1/p" \
                | sort -n \
                | tail -n 1
            )"
            if [[ -z "$latest_build" ]]; then
              new_tag="${base_tag}-build.1"
            else
              new_tag="${base_tag}-build.$((latest_build + 1))"
            fi
          fi

          echo "base-tag=${base_tag}" >> "$GITHUB_OUTPUT"
          echo "new-tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "previous-tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          echo "Base Hermes tag: ${base_tag}"
          echo "New image tag: ${new_tag}"
          echo "Previous repository tag: ${previous_tag}"

  create_tag:
    name: Create git tag
    needs:
      - lint
      - calculate_tag
    if: ${{ needs.calculate_tag.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      new-tag: ${{ needs.calculate_tag.outputs.new-tag }}
      previous-tag: ${{ needs.calculate_tag.outputs.previous-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          NEW_TAG: ${{ needs.calculate_tag.outputs.new-tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "refs/tags/${NEW_TAG}"

  build-and-push:
    name: Build & Push Image
    needs:
      - create_tag
    if: ${{ needs.create_tag.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.create_tag.outputs['new-tag'] }}
            type=raw,value=latest

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create_release:
    name: Publish release
    needs:
      - create_tag
      - build-and-push
    if: ${{ needs.build-and-push.result == 'success' && needs.create_tag.result == 'success' }}
    uses: vinitu/github-workflows/.github/workflows/workflow-create-release.yml@v0.1.9
    with:
      tag-name: ${{ needs.create_tag.outputs['new-tag'] }}
      previous-tag: ${{ needs.create_tag.outputs['previous-tag'] }}
      merged-prs: "[]"
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
